<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SarMusic</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body class="mat-typography">
  <app-root></app-root>

  <!-- Hidden YouTube iframe player -->
  <div style="display:none">
    <div id="player"></div>
  </div>
</body>

<!-- Load YouTube Iframe API -->
<script src="https://www.youtube.com/iframe_api"></script>

<script>
  let player;

  // Called automatically by YouTube API
  function onYouTubeIframeAPIReady() {
    player = new YT.Player('player', {
      height: '0',
      width: '0',
      videoId: '', // Initially blank
      playerVars: {
        'playsinline': 1
      },
      events: {
        'onReady': onPlayerReady,
        'onStateChange': onPlayerStateChange
      }
    });
  }

  function onPlayerReady(event) {
    console.log("YouTube Iframe API is ready ✅");
  }

  function onPlayerStateChange(event) {
    console.log("Player state:", event.data);
  }

  // Expose function to Angular for playing a song
  window.playYouTubeSong = function(videoId) {
    if (player && videoId) {
      player.loadVideoById(videoId);
      player.playVideo();
    }
  }

  // Expose function to pause
  window.pauseYouTubeSong = function() {
    if (player) player.pauseVideo();
  }
</script>
</html>
